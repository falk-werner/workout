<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Workout</title>
    <script type="module" src="script/main.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
<div id="page">
    <div id="status">
        Bereit
    </div>
    <div>
        <img id="ready" src="img/small/ready.jpg" />
        <img id="workout_1" class="hidden" src="img/small/workout_1.jpg" />
        <img id="workout_2" class="hidden" src="img/small/workout_2.jpg" />
        <img id="pause_1" class="hidden" src="img/small/pause_1.jpg" />
        <img id="pause_2" class="hidden" src="img/small/pause_2.jpg" />
    </div>

    <div>
        <input id="start" type="button" value="Los">
    </div>

    <hr>

    <div>
        <div>Wiederholungen:</div>
        <input id="count" type="number" value="8">
    </div>
    
    <div>
        <div>Dauer in Sekunden:</div>
        <input id="workout_duration" type="number" value="15">
    </div>

    <div>
        <div>Pause in Sekunden:</div>
        <input id="pause_duration" type="number" value="10">
    </div>

</div>
</body>
</html>
