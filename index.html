<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Workout</title>
    <script type="module" src="script/main.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
<div id="page">
    <div id="status">
        Bereit
    </div>
    <div>
        <img id="ready" src="img/small/ready.jpg" />
        <img id="workout_1" class="hidden" src="img/small/workout_1.jpg" />
        <img id="workout_2" class="hidden" src="img/small/workout_2.jpg" />
        <img id="breather_1" class="hidden" src="img/small/pause_1.jpg" />
        <img id="breather_2" class="hidden" src="img/small/pause_2.jpg" />
        <img id="pause_1" class="hidden" src="img/small/sleep_1.jpg" />
        <img id="pause_2" class="hidden" src="img/small/sleep_2.jpg" />
    </div>

    <div>
        <input id="start" type="button" value="Los">
    </div>

    <hr>

    <div id="info">
        <input id="toggle_settings" type="button" value="&#x2699;">
    </div>


    <div id="settings" class="hidden">
        <div>
            <div>Anzahl der Sätze:</div>
            <input id="set_count" type="number" value="3">
        </div>

        <div>
            <div>Wiederholungen pro Satz:</div>
            <input id="repeat_count" type="number" value="8">
        </div>

        <div>
            <div>Dauer in Sekunden:</div>
            <input id="training" type="number" value="15">
        </div>

        <div>
            <div>Pause zwischen den Wiederholungen:</div>
            <input id="breather" type="number" value="10">
        </div>

        <div>
            <div>Pause zwischen den Sätzen:</div>
            <input id="pause" type="number" value="60">
        </div>

    </div>

</div>
</body>
</html>
